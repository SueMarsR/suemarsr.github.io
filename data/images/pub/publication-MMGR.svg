<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="MMGR">
  <rect width="256" height="256" fill="#5B5BD6"/>

  <!-- Stacked frames suggesting multi-modal video / image reasoning -->
  <g transform="translate(128 96)" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">
    <rect x="-58" y="-22" width="76" height="52" rx="6" transform="rotate(-8)"/>
    <rect x="-46" y="-30" width="76" height="52" rx="6"/>
    <rect x="-34" y="-38" width="76" height="52" rx="6" transform="rotate(8)"/>
  </g>

  <!-- Interconnected nodes (reasoning graph) inside the top frame -->
  <g transform="translate(128 80)" fill="#ffffff">
    <circle cx="-14" cy="-2" r="3.5"/>
    <circle cx="2"   cy="-12" r="3.5"/>
    <circle cx="16"  cy="-2" r="3.5"/>
    <circle cx="2"   cy="10" r="3.5"/>
    <g stroke="#ffffff" stroke-width="2.2" fill="none">
      <line x1="-14" y1="-2"  x2="2" y2="-12"/>
      <line x1="2"   y1="-12" x2="16" y2="-2"/>
      <line x1="16"  y1="-2"  x2="2" y2="10"/>
      <line x1="2"   y1="10"  x2="-14" y2="-2"/>
    </g>
  </g>

  <text x="128" y="200" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="44" font-weight="700" fill="#ffffff" text-anchor="middle">MMGR</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Cognitive Priming Prompting">
  <rect width="256" height="256" fill="#E07A2C"/>

  <!-- Brain-shape suggested by two overlapping rounded lobes -->
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">
    <path d="M104 70
             c-20 0 -34 16 -34 34
             c-12 4 -16 18 -8 28
             c-8 12 4 28 18 26
             c2 12 16 18 28 12
             c8 8 22 6 26 -4
             v-96
             c-6 -8 -20 -10 -30 0z"/>
    <path d="M152 70
             c20 0 34 16 34 34
             c12 4 16 18 8 28
             c8 12 -4 28 -18 26
             c-2 12 -16 18 -28 12
             c-8 8 -22 6 -26 -4
             v-96
             c6 -8 20 -10 30 0z"/>
  </g>

  <!-- Multilingual text bubbles around the brain -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif"
     font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="46"  y="64">EN</text>
    <text x="210" y="64">中</text>
    <text x="42"  y="170">ES</text>
    <text x="214" y="170">日</text>
  </g>

  <!-- Spark dots -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="68"  cy="100" r="2.5"/>
    <circle cx="188" cy="100" r="2.5"/>
    <circle cx="78"  cy="140" r="2.5"/>
    <circle cx="178" cy="140" r="2.5"/>
  </g>

  <text x="128" y="218" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">CogPrime</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="RASPberry">
  <rect width="256" height="256" fill="#C0345C"/>

  <!-- Tree (MCTS) structure -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="128" y1="60"  x2="86"  y2="110"/>
    <line x1="128" y1="60"  x2="170" y2="110"/>
    <line x1="86"  y1="110" x2="60"  y2="160"/>
    <line x1="86"  y1="110" x2="108" y2="160"/>
    <line x1="170" y1="110" x2="148" y2="160"/>
    <line x1="170" y1="110" x2="196" y2="160"/>
  </g>
  <g fill="#ffffff">
    <circle cx="128" cy="60"  r="9"/>
    <circle cx="86"  cy="110" r="7"/>
    <circle cx="170" cy="110" r="7"/>
    <circle cx="60"  cy="160" r="6"/>
    <circle cx="108" cy="160" r="6"/>
    <circle cx="148" cy="160" r="6"/>
    <circle cx="196" cy="160" r="6"/>
  </g>

  <!-- Document chip on the root suggesting retrieval-augmentation -->
  <g transform="translate(150 46)" fill="#ffffff" stroke="#C0345C" stroke-width="2">
    <rect x="0" y="0" width="22" height="26" rx="3"/>
    <line x1="4"  y1="8"  x2="18" y2="8"  stroke="#C0345C" stroke-width="2"/>
    <line x1="4"  y1="14" x2="18" y2="14" stroke="#C0345C" stroke-width="2"/>
    <line x1="4"  y1="20" x2="14" y2="20" stroke="#C0345C" stroke-width="2"/>
  </g>

  <text x="128" y="210" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">RASPberry</text>
</svg>

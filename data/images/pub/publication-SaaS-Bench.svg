    <circle cx="184" cy="132" r="5"/>
    <path d="M76 105 l5 5 10 -13" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M123 105 l5 5 10 -13" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M170 105 l5 5 10 -13" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="128" y="205" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="31" font-weight="700" fill="#ffffff" text-anchor="middle">SaaS-Bench</text>

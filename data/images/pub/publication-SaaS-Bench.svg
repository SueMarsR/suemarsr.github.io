<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="SaaS-Bench">
  <rect width="256" height="256" fill="#0F766E"/>

  <!-- Browser window around a deployable SaaS workflow -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="42" y="42" width="172" height="118" rx="10"/>
    <line x1="42" y1="72" x2="214" y2="72"/>
    <circle cx="58" cy="57" r="3" fill="#ffffff" stroke="none"/>
    <circle cx="72" cy="57" r="3" fill="#ffffff" stroke="none"/>
    <circle cx="86" cy="57" r="3" fill="#ffffff" stroke="none"/>
  </g>

  <!-- Cross-application workflow nodes -->
  <g fill="#0F766E" stroke="#ffffff" stroke-width="4">
    <rect x="62" y="92" width="38" height="26" rx="6"/>
    <rect x="109" y="92" width="38" height="26" rx="6"/>
    <rect x="156" y="92" width="38" height="26" rx="6"/>
  </g>

  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
